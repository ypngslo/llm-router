services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    # Loopback only — per infra, just Caddy ever listens on a public interface.
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./llm-config.yml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    env_file:
      - .env
    # Lets the container reach vLLM running on the HOST machine.
    # Works on Docker Desktop (Mac/Win) automatically; the line below
    # makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
