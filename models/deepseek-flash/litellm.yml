# deepseek-flash — DeepSeek V4 Flash via OpenRouter. Same 1M window as pro at
# ~1/3 the input price ($0.14 vs $0.435 per M) — the cheap default for
# chat-facing agents that don't need pro's depth. Cloud-only.
model_list:
  - model_name: deepseek-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      disable_background_health_check: true   # health probes are real billable calls
