model_list:
  # --- Chat (Qwen3.5-4B) ---
  - model_name: qwen-chat
    litellm_params:
      model: hosted_vllm/Qwen/Qwen3.5-4B
      api_base: http://host.docker.internal:8001/v1
      api_key: "dummy"            # vLLM ignores this unless you started it with --api-key

  # --- Embeddings ---
  - model_name: embeddings
    litellm_params:
      model: hosted_vllm/your-embedding-model
      api_base: http://host.docker.internal:8002/v1
      api_key: "dummy"

  # --- Code (Qwen2.5-Coder-32B) ---
  - model_name: qwen-coder
    litellm_params:
      model: hosted_vllm/Qwen/Qwen2.5-Coder-32B-Instruct
      api_base: http://host.docker.internal:8003/v1
      api_key: "dummy"

  # --- Vision (uncomment once you serve a VL model for the image API) ---
  # - model_name: qwen-vision
  #   litellm_params:
  #     model: hosted_vllm/Qwen/Qwen2.5-VL-7B-Instruct
  #     api_base: http://host.docker.internal:8004/v1
  #     api_key: "dummy"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # clients must send this as Bearer token

litellm_settings:
  drop_params: true     # silently drop unsupported params instead of erroring
