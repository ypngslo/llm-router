# llm-config.yml — the LiteLLM router: stack-wide settings + the model include list.
# Each model's entries live NEXT TO the model in models/<name>/litellm.yml; the
# include below pulls them in (LiteLLM extends model_list across included files).
# To disable a model at the router: comment out its include line + `docker restart
# litellm`. Paths resolve inside the container against /app: the compose file
# mounts this file at /app/config.yaml and ./models at /app/models (both ro).

include:
  - models/chat/litellm.yml
  - models/embed-sm/litellm.yml
  - models/rerank/litellm.yml
  - models/transcribe/litellm.yml
  - models/tts/litellm.yml
  - models/deepseek-pro/litellm.yml
  - models/deepseek-flash/litellm.yml
  # - models/coder/litellm.yml   # enable with the coder unit — see docs/wake-proxy.md

model_list:
  # Wildcards: call ANY cloud model through this proxy (model="anthropic/claude-...").
  - model_name: "openai/*"
    litellm_params:
      model: "openai/*"
      api_key: os.environ/OPENAI_API_KEY
  - model_name: "anthropic/*"
    litellm_params:
      model: "anthropic/*"
      api_key: os.environ/ANTHROPIC_API_KEY

router_settings:
  num_retries: 2          # retries within a model group before any fallback/escalation
  retry_policy:           # don't burn retries on errors that can never succeed
    BadRequestErrorRetries: 0
    AuthenticationErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    TimeoutErrorRetries: 1
    RateLimitErrorRetries: 2
  # Requests over chat's local maxlen (65536: Qwen3.5-9B-FP8) route to the
  # 1M-context cloud model instead of erroring:
  context_window_fallbacks: [{"qwen-chat": ["deepseek-pro"]}]
  # No default_fallbacks: embeddings/rerank/audio have no same-shape cloud twin,
  # and qwen-chat already fails over via `order` (see models/chat/litellm.yml).

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # clients must send this as Bearer token
  # Virtual keys / budgets / rate limits / spend logs — the `litellm` DB in the shared
  # postgres from ../llm-observability (127.0.0.1:8009). Prisma creates the schema on
  # first boot. Issue per-app keys with POST /key/generate {"rpm_limit":..., "tpm_limit":...,
  # "max_budget":...} instead of handing out the master key — that's also what makes
  # Langfuse traces attributable per app.
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false  # the include list above stays the source of truth

litellm_settings:
  drop_params: true       # silently drop unsupported params instead of erroring
  # Trace every request/failure to Langfuse (../llm-observability, 127.0.0.1:3000).
  # Async batched callback — off the request hot path; harmless if Langfuse is down.
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # Tag every trace with the calling key's alias (+ user when callers pass "user"),
  # so the Langfuse dashboard is sliceable per app instead of one anonymous blob.
  langfuse_default_tags: ["user_api_key_alias", "user_api_key_user_id"]
  json_logs: true         # structured logs (docker logs litellm | jq)
  request_timeout: 300    # hard cap per request; local models should never get close
  # Cloud spend cap, no Postgres needed (local hosted_vllm calls cost $0, so this
  # effectively caps cloud-fallback spend):
  max_budget: 25        # USD
  budget_duration: 30d
