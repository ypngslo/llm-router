# infra.toml — the stack chassis: the LiteLLM front door and the waker.
# Everything model-shaped declares its own service next to its config, in
# models/<name>/infra.toml — register those from their own dirs (`cd models/chat
# && infra register && infra enable`) or from anywhere with `--config`.
#
# Topology: `litellm` is the front door (the router). It proxies to the vLLM
# units and audio containers over host loopback (it runs with network_mode:
# host); every vLLM api_base points at the waker (:8008), which wakes/sleeps
# the GPU tenants on demand.
#
# VRAM CAVEAT — infra cannot express the GPU budget. Registering a service only
# RESERVES its port + renders its unit; it does NOT mean run it. waker.py
# enforces the live budget (docs/wake-proxy.md); `./serve.py --list` prints it.

# ── Front door: LiteLLM proxy (container) ──────────────────────────────────────
[[service]]
name = "litellm"
role = "llm-proxy"            # port range 4000–4099
reach = "tailnet"            # Caddy HTTPS route at /litellm; switch to "host" for box-only
path = "/litellm"
kind = "compose"
compose_file = "./docker-compose.yml"
service = "litellm"          # the service name inside docker-compose.yml
port = 4000                  # pinned: the compose publishes 127.0.0.1:4000 and llm-config assumes it

# ── Wake proxy: sleep-aware router between litellm and the vLLM backends ──────
# litellm's api_bases point here (http://localhost:8008/<slug>/v1). On demand it
# wakes the requested model, first putting idle ones to sleep if the card can't
# hold both. uv by absolute path (needs the repo venv for aiohttp; systemd PATH
# doesn't have uv).
[[service]]
name = "waker"
role = "backend"
reach = "host"
kind = "systemd"
exec_start = "/home/beans/.local/bin/uv run --project /home/beans/code/system/llm-router src/waker.py"
working_dir = "."
port = 8008
